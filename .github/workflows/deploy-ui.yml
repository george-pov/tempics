name: Deploy UI
run-name: Deploy UI to ${{ inputs.environment || 'dev' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: tempics-ui-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build UI
        run: |
          npm install --global npm@12
          npm ci
          npm run build
      - name: Write public configuration
        env:
          UI_APP_CONFIG_JSON: ${{ vars.UI_APP_CONFIG_JSON }}
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(process.env.UI_APP_CONFIG_JSON);
          if (!process.env.AZURE_FUNCTION_KEY) throw new Error('Missing AZURE_FUNCTION_KEY');
          config.functionKey = process.env.AZURE_FUNCTION_KEY;
          fs.writeFileSync('dist/tempics/browser/config.json', JSON.stringify(config) + '\n');
          NODE
          cp scripts/404.html dist/tempics/browser/404.html
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy static website
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_UI_STORAGE }}
        run: |
          az storage blob upload-batch --auth-mode login --destination '$web' --source dist/tempics/browser --overwrite true --content-cache-control no-store --only-show-errors --output none
          for route in component-lab component-lab/index.html; do
            az storage blob upload --auth-mode login --container-name '$web' --name "$route" --file dist/tempics/browser/index.html --overwrite true --content-type text/html --content-cache-control no-store --only-show-errors --output none
          done
