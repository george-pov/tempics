name: Deploy dev UI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tempics-ui-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build UI
        run: |
          npm install --global npm@12
          npm ci
          npm run build
      - name: Write public configuration
        env:
          UI_APP_CONFIG_JSON: ${{ vars.UI_APP_CONFIG_JSON }}
        run: |
          printf '%s\n' "$UI_APP_CONFIG_JSON" > dist/tempics/browser/config.json
          cp scripts/404.html dist/tempics/browser/404.html
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy static website
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_UI_STORAGE }}
        run: |
          az storage blob upload-batch --auth-mode login --destination '$web' --source dist/tempics/browser --overwrite true --content-cache-control no-store --only-show-errors --output none
          for route in component-lab component-lab/index.html; do
            az storage blob upload --auth-mode login --container-name '$web' --name "$route" --file dist/tempics/browser/index.html --overwrite true --content-type text/html --content-cache-control no-store --only-show-errors --output none
          done
