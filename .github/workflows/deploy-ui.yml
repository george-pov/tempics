name: Deploy dev UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - name: Select npm
        run: npm install --global npm@12.0.1
      - name: Install locked dependencies
        working-directory: src/ui
        run: npm ci
      - name: Test public configuration
        working-directory: src/ui
        run: npm run test:config
      - name: Test site packaging and upload validation
        working-directory: src/ui
        run: npm run test:site
      - name: Test Angular
        working-directory: src/ui
        run: npm run ng -- test -- --watch=false
      - name: Test hosted UI checker
        run: node --test deployment/check-ui.test.mjs
      - name: Test setup boundaries
        shell: pwsh
        run: ./deployment/test-setup.ps1
      - name: Build production UI
        working-directory: src/ui
        run: npm run build
      - name: Create configuration-free artifact
        run: node deployment/ui-artifact.mjs create --artifact "$RUNNER_TEMP/ui-artifact" --input src/ui/dist/tempics/browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-artifact/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tempics-ui-dev
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_FUNCTION_APP: ${{ vars.AZURE_FUNCTION_APP }}
      AZURE_UI_STORAGE: ${{ vars.AZURE_UI_STORAGE }}
      TP_ENV: ${{ vars.TP_ENV }}
      TP_API_URL: ${{ vars.TP_API_URL }}
      TP_UI_URL: ${{ vars.TP_UI_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/ui/dist/artifact
      - name: Verify source, lockfile and compiled assets
        run: node deployment/ui-artifact.mjs verify --artifact src/ui/dist/artifact
      - name: Validate dev inputs
        shell: pwsh
        run: ./deployment/Check-UiTarget.ps1
      - name: Select npm
        run: npm install --global npm@12.0.1
      - name: Install locked packaging tooling
        working-directory: src/ui
        run: npm ci --ignore-scripts
      - name: Package public dev configuration
        working-directory: src/ui
        run: npm run package:site -- --input dist/artifact/browser --out dist/site/package
      - name: Retain source manifest with deployment package
        shell: pwsh
        run: Copy-Item -LiteralPath src/ui/dist/artifact/manifest.json -Destination src/ui/dist/site/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/ui/dist/site/
          if-no-files-found: error
          retention-days: 14
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish validated blobs
        id: publish
        shell: pwsh
        run: ./deployment/Publish-Ui.ps1 -PackagePath src/ui/dist/site/package -BlobMapPath src/ui/dist/site/blobs.json
      - name: Verify hosted UI
        id: verify
        run: node deployment/check-ui.mjs --package src/ui/dist/site/package --map src/ui/dist/site/blobs.json
      - name: Summarize publication and verification
        if: always()
        shell: pwsh
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          @"
          Revision: $env:GITHUB_SHA
          Website: $env:TP_UI_URL
          Publication: $env:PUBLISH_OUTCOME
          HTTP/package check: $env:VERIFY_OUTCOME
          Upload is not atomic. Recover using the compatible retained package and blobs.json.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
