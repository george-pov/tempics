name: Deploy dev API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.300'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - name: Restore
        run: dotnet restore src/api/Tempics.slnx
      - name: Build
        run: dotnet build src/api/Tempics.slnx -c Release --no-restore
      - name: Test solution
        run: dotnet test --solution src/api/Tempics.slnx -c Release --no-build
      - name: Test hosted checker
        run: node --test deployment/check-api.test.mjs
      - name: Test setup boundaries
        shell: pwsh
        run: ./deployment/test-setup.ps1
      - name: Publish Linux package
        run: dotnet publish src/api/TP.AzureFunctions/TP.AzureFunctions.csproj -c Release --runtime linux-x64 --self-contained false --output "$RUNNER_TEMP/api-publish"
      - name: Package and inspect
        shell: pwsh
        run: ./deployment/Package-Api.ps1 -PublishPath "$env:RUNNER_TEMP/api-publish" -ArtifactPath "$env:RUNNER_TEMP/api-artifact" -SourceSha $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-artifact/function.zip
            ${{ runner.temp }}/api-artifact/manifest.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tempics-api-dev
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_FUNCTION_APP: ${{ vars.AZURE_FUNCTION_APP }}
      TP_ENV: ${{ vars.TP_ENV }}
      TP_API_URL: ${{ vars.TP_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-artifact
      - name: Verify artifact revision and contents
        shell: pwsh
        run: ./deployment/Package-Api.ps1 -VerifyOnly -ArtifactPath "$env:RUNNER_TEMP/api-artifact" -SourceSha $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
      - name: Preflight dev inputs
        shell: pwsh
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          ./deployment/Check-ApiTarget.ps1
          if ([string]::IsNullOrWhiteSpace($env:AZURE_FUNCTION_KEY)) { throw 'Missing Function verification key.' }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify live Function target
        shell: pwsh
        run: ./deployment/Check-ApiTarget.ps1 -ReadAzure
      - name: Deploy verified ZIP
        id: publish
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP }}
          package: ${{ runner.temp }}/api-artifact/function.zip
          remote-build: false
      - name: Verify protected render
        id: verify
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: node deployment/check-api.mjs
      - name: Summarize deployment and verification
        if: always()
        shell: pwsh
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          @"
          Revision: $env:GITHUB_SHA
          Target: func-tempics-api-dev
          Deployment: $env:PUBLISH_OUTCOME
          Protected PNG check: $env:VERIFY_OUTCOME
          A failed check does not undo deployment. Recovery requires a known-good ZIP.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
